<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarX Street - Web Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        /* --- تصميم صفحة البداية المطابق لصورتك --- */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #111a28, #0a0f18);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .title {
            color: #facc15; font-size: 2.5rem; font-weight: bold; text-align: center;
            margin-bottom: 40px; text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }
        .btn-menu {
            width: 280px; padding: 18px; margin: 10px; border-radius: 12px; border: none;
            font-size: 1.2rem; font-weight: bold; color: white; cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
        }
        .btn-menu:active { transform: scale(0.95); }
        
        .btn-red { background: #ef4444; box-shadow: 0 6px 0 #b91c1c; }
        .btn-blue { background: #3b82f6; box-shadow: 0 6px 0 #1d4ed8; }
        
        /* --- أزرار التحكم والسرعة --- */
        .controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .touch-btn {
            width: 75px; height: 75px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 1.8rem; -webkit-user-select: none;
            backdrop-filter: blur(5px);
        }
        .touch-btn:active { background: #ef4444; border-color: #ef4444; }
        
        #speed-ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 1.8rem; font-weight: bold; font-family: monospace;
            text-shadow: 2px 2px 4px #000;
        }
        #loading-text { color: #888; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="title">سباق الشوارع<br>🌍 CarX Web 🚗</div>
        
        <button class="btn-menu btn-red" onclick="start()" id="start-btn" style="opacity: 0.5;" disabled>جاري التحميل... ⏳</button>
        <button class="btn-menu btn-blue" onclick="alert('خاصية تعديل السيارات سيتم إضافتها قريباً!')">اختيار وتعديل السيارة 🔧</button>
        <button class="btn-menu btn-blue" onclick="alert('قائمة الإعدادات تحت التطوير')">الإعدادات ⚙️</button>
        
        <div id="loading-text">جاري بناء الخريطة وتحميل السيارة...</div>
    </div>

    <div id="speed-ui">0 KM/H</div>
    <div class="controls">
        <div class="control-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-up">▲</div>
            <div class="touch-btn" id="btn-down">▼</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, car;
        let speed = 0, turn = 0;
        const input = { up: false, down: false, left: false, right: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510); // سماء ليلية
            scene.fog = new THREE.FogExp2(0x050510, 0.005); // ضباب ليلي

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // إضاءة المدينة (Neon)
            const ambient = new THREE.AmbientLight(0x222244, 1.5);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0x3b82f6, 2);
            directional.position.set(100, 100, 50);
            scene.add(directional);

            // 1. أرضية الطريق
            const floorGeo = new THREE.PlaneGeometry(2000, 2000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(2000, 100, 0x3b82f6, 0x111122);
            grid.position.y = 0.1;
            scene.add(grid);

            // 2. بناء مدينة عشوائية (مباني على الجانبين)
            buildCity();

            // 3. تحميل السيارة
            const loader = new GLTFLoader();
            const carURL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb';
            
            loader.load(carURL, (gltf) => {
                car = gltf.scene;
                car.rotation.y = Math.PI; // تصحيح اتجاه السيارة
                scene.add(car);
                
                // تفعيل زر البداية
                const startBtn = document.getElementById('start-btn');
                startBtn.innerText = "بدء السباق 🏁";
                startBtn.style.opacity = "1";
                startBtn.disabled = false;
                document.getElementById('loading-text').style.display = 'none';
            });

            setupMobileControls();
            animate();
        }

        // دالة لبناء مباني عشوائية حول الطريق
        function buildCity() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.3 });
            const instancedMesh = new THREE.InstancedMesh(boxGeo, boxMat, 300);
            
            const dummy = new THREE.Object3D();
            for(let i = 0; i < 300; i++) {
                // وضع المباني بعيداً عن منتصف الطريق
                const side = Math.random() > 0.5 ? 1 : -1;
                const x = side * (Math.random() * 200 + 20); 
                const z = (Math.random() - 0.5) * 1500;
                const height = Math.random() * 40 + 10;
                
                dummy.position.set(x, height / 2, z);
                dummy.scale.set(15 + Math.random()*10, height, 15 + Math.random()*10);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedMesh);
        }

        function setupMobileControls() {
            const bind = (id, prop) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); input[prop] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); input[prop] = false; });
            };
            bind('btn-up', 'up'); bind('btn-down', 'down');
            bind('btn-left', 'left'); bind('btn-right', 'right');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (car) {
                // فيزياء الحركة
                if (input.up) speed += 0.005;
                if (input.down) speed -= 0.005;
                if (input.left) turn += 0.004;
                if (input.right) turn -= 0.004;

                speed *= 0.98; // الاحتكاك
                turn *= 0.92;  // استعدال العجلات

                car.translateZ(-speed);
                car.rotation.y += turn * (speed * 3.5);

                // --- إصلاح الكاميرا الدقيق ---
                // 1. تحديد مكان الكاميرا (خلف السيارة بمسافة 12 وأعلى بمسافة 5)
                const offset = new THREE.Vector3(0, 5, 12);
                const idealPosition = offset.applyQuaternion(car.quaternion).add(car.position);
                
                // 2. تحديد النقطة التي تنظر إليها الكاميرا (أمام السيارة)
                const lookAtTarget = new THREE.Vector3(0, 1, -10);
                const idealLookAt = lookAtTarget.applyQuaternion(car.quaternion).add(car.position);

                // 3. تحريك الكاميرا بسلاسة (Lerp)
                camera.position.lerp(idealPosition, 0.1);
                camera.lookAt(idealLookAt);

                document.getElementById('speed-ui').innerText = Math.round(Math.abs(speed * 1500)) + " KM/H";
            }
            renderer.render(scene, camera);
        }

        window.start = function() {
            document.getElementById('ui-overlay').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
