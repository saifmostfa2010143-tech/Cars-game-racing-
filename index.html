<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Racing - Saif Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: sans-serif; }
        
        /* واجهة البداية */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .title { color: #facc15; font-size: 2.5rem; text-align: center; margin-bottom: 30px; }
        .btn-play { padding: 15px 60px; font-size: 1.5rem; background: #ef4444; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #991b1b; }

        /* التحكم: الدركسيون شمال والبنزين يمين */
        .controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 40px;
            box-sizing: border-box; z-index: 10; pointer-events: none;
        }
        .control-group { display: flex; gap: 20px; pointer-events: auto; }
        .touch-btn {
            width: 85px; height: 85px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 2rem; backdrop-filter: blur(5px);
        }

        #speed-ui {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
            padding: 10px 20px; border-radius: 15px; color: #facc15; font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="title">سباق العوالم 🏎️<br>Saif Mostafa</div>
        <button class="btn-play" onclick="startApp()">ابدأ السباق</button>
    </div>

    <div id="speed-ui"><span id="speed-val">0</span> KM/H</div>

    <div class="controls">
        <div class="control-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-down">▼</div>
            <div class="touch-btn" id="btn-up">▲</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, car;
        let speed = 0, turn = 0;
        const input = { up: false, down: false, left: false, right: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(100, 200, 100);
            scene.add(sun);

            const loader = new GLTFLoader();

            // تحميل المدينة الحقيقية (رابط مباشر جاهز)
            loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/LittlestTokyo.glb', (gltf) => {
                const city = gltf.scene;
                city.scale.set(0.1, 0.1, 0.1); 
                city.position.y = -2;
                scene.add(city);
            });

            // تحميل السيارة
            loader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb', (gltf) => {
                car = gltf.scene;
                scene.add(car);
            });

            setupControls();
            animate();
        }

        function setupControls() {
            const bind = (id, prop) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); input[prop] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); input[prop] = false; });
            };
            bind('btn-up', 'up'); bind('btn-down', 'down');
            bind('btn-left', 'left'); bind('btn-right', 'right');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (car) {
                if (input.up) speed += 0.01;
                if (input.down) speed -= 0.01;
                if (input.left) turn += 0.005;
                if (input.right) turn -= 0.005;

                speed *= 0.96; turn *= 0.9;
                car.translateZ(-speed);
                car.rotation.y += turn * (speed * 4);

                // --- الكاميرا الحديدية الملحومة خلف السيارة ---
                const relativeOffset = new THREE.Vector3(0, 5, 12);
                const actualOffset = relativeOffset.applyMatrix4(car.matrixWorld);
                camera.position.copy(actualOffset);
                
                const targetPoint = new THREE.Vector3(0, 2, -10).applyMatrix4(car.matrixWorld);
                camera.lookAt(targetPoint);

                document.getElementById('speed-val').innerText = Math.round(Math.abs(speed * 1500));
            }
            renderer.render(scene, camera);
        }

        window.startApp = () => { document.getElementById('ui-overlay').style.display = 'none'; };

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
    </html>
