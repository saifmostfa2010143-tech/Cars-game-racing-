<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة سيارات أفقية فيزيائية - المستوى الاحترافي</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0a1a3a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; }
        
        /* واجهة المستخدم والتصميم */
        #ui {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .panel {
            background: rgba(0, 0, 0, 0.6); padding: 10px 20px;
            border-radius: 10px; color: white; border: 1px solid rgba(255,255,255,0.2);
            font-size: 24px; font-weight: bold; backdrop-filter: blur(5px);
        }
        #speedometer { color: #00ffcc; }
        #distance { color: #ffcc00; }

        /* أزرار الهاتف الاحترافية */
        #controls {
            position: absolute; bottom: 30px; left: 30px; right: 30px;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .btn {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); border: 3px solid rgba(255, 255, 255, 0.4);
            color: white; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); cursor: pointer; text-align: center; line-height: 1.2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.9); border-color: #fff; }

        @media (min-width: 800px) { #controls { display: none; } }
    </style>
</head>
<body>

<div id="ui">
    <div class="panel" id="distance">المسافة: 0m</div>
    <div class="panel" id="speedometer">0 km/h</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
    <div class="btn" id="btnBrake">فرامل<br>رجوع</div>
    <div class="btn" id="btnGas">بنزين<br>أمام</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    // 1. إعدادات الفيزياء المتطورة
    const PHYSICS = {
        gravity: 0.25,      // الجاذبية
        friction: 0.995,    // الاحتكاك الكلي
        enginePower: 0.6,   // قوة المحرك
        springK: 0.15,      // صلابة المساعدين (Suspension)
        damping: 0.1,       // ممتص الصدمات
        maxSpeed: 25
    };

    // 2. حالة السيارة
    let car = {
        x: 400, y: 100, vx: 0, vy: 0, angle: 0, angularVelocity: 0,
        width: 80, height: 20, wheelRadius: 18, wheelAngle: 0,
        mass: 1.0, inertia: 1500, // القصور الذاتي (لمنع الانقلاب بسهولة)
        rearOffset: -35, frontOffset: 35
    };

    // 3. التضاريس اللانهائية (Procedural Terrain)
    let terrain = [{x: 0, y: 400}];
    const SEGMENT_WIDTH = 40;
    
    function getTerrainHeight(x) {
        // توليد أراضي جديدة كلما تقدم اللاعب
        while (terrain[terrain.length - 1].x < x + canvas.width * 2) {
            let last = terrain[terrain.length - 1];
            let nextX = last.x + SEGMENT_WIDTH;
            // معادلات رياضية (Sine Waves) لتوليد تلال عشوائية ناعمة
            let noise = Math.sin(nextX * 0.003) * 150 + Math.sin(nextX * 0.01) * 80 + Math.sin(nextX * 0.05) * 20;
            terrain.push({ x: nextX, y: 450 + noise });
        }
        
        if (x < 0) return terrain[0].y;
        
        let startIdx = Math.max(0, Math.floor(x / SEGMENT_WIDTH));
        if (startIdx >= terrain.length - 1) return terrain[terrain.length - 1].y;
        
        let t1 = terrain[startIdx], t2 = terrain[startIdx + 1];
        let t = (x - t1.x) / SEGMENT_WIDTH;
        return t1.y + (t2.y - t1.y) * t; // Interpolation (تنعيم التضاريس)
    }

    // 4. نظام الجزيئات (Particles) للغبار والدخان
    let particles = [];
    function spawnParticle(x, y, isExhaust) {
        if (Math.random() > 0.4) return;
        particles.push({
            x: x, y: y,
            vx: isExhaust ? (-Math.cos(car.angle)*2 + (Math.random()-0.5)) : (-car.vx * 0.2 + (Math.random()-0.5)*2),
            vy: isExhaust ? (-Math.sin(car.angle)*2 + (Math.random()-0.5)) : (-2 + Math.random()),
            life: isExhaust ? 20 : 40,
            maxLife: isExhaust ? 20 : 40,
            color: isExhaust ? 'rgba(150, 150, 150, ' : 'rgba(139, 69, 19, ' // رمادي للعادم، بني للتراب
        });
    }

    // 5. التحكم والكاميرا
    const keys = { gas: false, brake: false };
    let camera = { x: 0, y: 0 };

    window.addEventListener('keydown', (e) => { 
        if(e.code === 'ArrowRight' || e.code === 'ArrowUp') keys.gas = true;
        if(e.code === 'ArrowLeft' || e.code === 'ArrowDown') keys.brake = true;
    });
    window.addEventListener('keyup', (e) => { 
        if(e.code === 'ArrowRight' || e.code === 'ArrowUp') keys.gas = false;
        if(e.code === 'ArrowLeft' || e.code === 'ArrowDown') keys.brake = false;
    });

    const setupBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
    };
    setupBtn('btnGas', 'gas'); setupBtn('btnBrake', 'brake');

    // 6. المحرك الفيزيائي (تحديث كل إطار)
    function update() {
        car.vy += PHYSICS.gravity; // تطبيق الجاذبية

        let cos = Math.cos(car.angle), sin = Math.sin(car.angle);
        
        // حساب إحداثيات الإطارات (خلفي وأمامي)
        let rwX = car.x + car.rearOffset * cos - 15 * sin;
        let rwY = car.y + car.rearOffset * sin + 15 * cos;
        let fwX = car.x + car.frontOffset * cos - 15 * sin;
        let fwY = car.y + car.frontOffset * sin + 15 * cos;

        let terrRearY = getTerrainHeight(rwX);
        let terrFrontY = getTerrainHeight(fwX);
        let onGround = false;

        // دالة تطبيق فيزياء المساعدين والاصطدام بالأرض
        function applyWheelPhysics(wx, wy, ty, offsetX) {
            let overlap = (wy + car.wheelRadius) - ty; // مقدار اختراق العجلة للأرض
            if (overlap > 0) {
                onGround = true;
                
                let ptVy = car.vy + car.angularVelocity * (wx - car.x); // سرعة النزول الدقيقة للعجلة
                
                // قوة المساعدين (Spring Force + Damping)
                let forceY = overlap * PHYSICS.springK + ptVy * PHYSICS.damping;
                if (forceY < 0) forceY = 0; // الأرض لا تسحب السيارة لأسفل
                
                car.vy -= forceY / car.mass; // رفع السيارة
                car.angularVelocity -= ((wx - car.x) * forceY) / car.inertia; // دوران السيارة بسبب الاصطدام
                
                // قوة المحرك والفرامل (Traction)
                if (keys.gas) {
                    car.vx += cos * PHYSICS.enginePower; car.vy += sin * PHYSICS.enginePower;
                    spawnParticle(wx, ty, false); // إخراج تراب
                }
                if (keys.brake) {
                    car.vx -= cos * PHYSICS.enginePower; car.vy -= sin * PHYSICS.enginePower;
                    spawnParticle(wx, ty, false); // إخراج تراب
                }
            }
        }

        applyWheelPhysics(rwX, rwY, terrRearY, car.rearOffset);
        applyWheelPhysics(fwX, fwY, terrFrontY, car.frontOffset);

        // الاحتكاك بالهواء والأرض
        car.vx *= PHYSICS.friction;
        car.vy *= PHYSICS.friction;
        car.angularVelocity *= 0.95;

        // التحكم في دوران السيارة أثناء الطيران في الهواء (مثل Hill Climb)
        if (!onGround) {
            if (keys.gas) car.angularVelocity += 0.004;
            if (keys.brake) car.angularVelocity -= 0.004;
        }

        // تحديد السرعة القصوى
        if(car.vx > PHYSICS.maxSpeed) car.vx = PHYSICS.maxSpeed;
        if(car.vx < -PHYSICS.maxSpeed) car.vx = -PHYSICS.maxSpeed;

        // تحديث الإحداثيات
        car.x += car.vx;
        car.y += car.vy;
        car.angle += car.angularVelocity;
        car.wheelAngle += car.vx / car.wheelRadius; // دوران الإطارات بصرياً

        if (keys.gas) spawnParticle(car.x - 45*cos, car.y - 45*sin, true); // دخان عادم

        // الكاميرا تتبع السيارة بسلاسة وبدون أي دوران
        camera.x += (car.x - canvas.width * 0.3 - camera.x) * 0.1;
        camera.y += (car.y - canvas.height * 0.6 - camera.y) * 0.1;

        // تحديث الواجهة UI
        document.getElementById('speedometer').innerText = Math.abs(Math.floor(car.vx * 3.6)) + ' km/h';
        document.getElementById('distance').innerText = 'المسافة: ' + Math.max(0, Math.floor(car.x / 50)) + 'm';
        
        // تحديث الجزيئات
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
        particles = particles.filter(p => p.life > 0);
    }

    // 7. الرسم الاحترافي للمشهد
    function draw() {
        // رسم السماء والخلفية المتحركة (Parallax)
        let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#0a1a3a'); sky.addColorStop(1, '#ff7b54');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // شمس
        ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(canvas.width * 0.8, canvas.height * 0.4, 60, 0, Math.PI*2); ctx.fill();

        ctx.save();
        ctx.translate(-camera.x, -camera.y); // تحريك الكاميرا (بدون دوران)

        // رسم الجبال الخلفية (تتحرك ببطء)
        ctx.fillStyle = '#2c3e50';
        ctx.beginPath(); ctx.moveTo(camera.x, camera.y + canvas.height + 500);
        for(let i = camera.x - 200; i < camera.x + canvas.width + 200; i+=100) {
            ctx.lineTo(i, Math.sin(i * 0.002) * 200 + 400);
        }
        ctx.lineTo(camera.x + canvas.width + 200, camera.y + canvas.height + 500); ctx.fill();

        // رسم التضاريس الأرضية (التي نتفاعل معها)
        let startIdx = Math.max(0, Math.floor((camera.x - 200) / SEGMENT_WIDTH));
        let endIdx = Math.min(terrain.length - 1, startIdx + Math.ceil(canvas.width / SEGMENT_WIDTH) + 10);

        ctx.beginPath();
        ctx.moveTo(terrain[startIdx].x, camera.y + canvas.height + 500);
        for (let i = startIdx; i <= endIdx; i++) ctx.lineTo(terrain[i].x, terrain[i].y);
        ctx.lineTo(terrain[endIdx].x, camera.y + canvas.height + 500);
        ctx.closePath();
        
        ctx.fillStyle = '#5A3A22'; // لون التراب
        ctx.fill();
        ctx.lineWidth = 15; ctx.strokeStyle = '#4CAF50'; // لون العشب
        ctx.stroke();

        // رسم الجزيئات (الغبار والدخان)
        particles.forEach(p => {
            ctx.fillStyle = p.color + (p.life / p.maxLife) + ')';
            ctx.beginPath(); ctx.arc(p.x, p.y, (p.maxLife - p.life) * 0.5 + 2, 0, Math.PI*2); ctx.fill();
        });

        // رسم السيارة
        ctx.save();
        ctx.translate(car.x, car.y);
        ctx.rotate(car.angle);

        // المساعدين (Suspension Lines)
        ctx.strokeStyle = '#888'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(car.rearOffset, 0); ctx.lineTo(car.rearOffset, 15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(car.frontOffset, 0); ctx.lineTo(car.frontOffset, 15); ctx.stroke();

        // هيكل السيارة
        ctx.fillStyle = '#ff3300';
        ctx.beginPath(); 
        ctx.roundRect ? ctx.roundRect(-45, -10, 90, 20, 5) : ctx.fillRect(-45, -10, 90, 20); // الشاسيه
        ctx.roundRect ? ctx.roundRect(-25, -35, 45, 30, 10) : ctx.fillRect(-25, -35, 45, 30); // الكابينة
        ctx.fill();

        // نافذة
        ctx.fillStyle = '#bbddff';
        ctx.fillRect(-10, -30, 25, 15);

        // إضاءة أمامية
        if(keys.gas) {
            ctx.fillStyle = 'rgba(255, 255, 150, 0.2)';
            ctx.beginPath(); ctx.moveTo(45, -5); ctx.lineTo(400, -80); ctx.lineTo(400, 150); ctx.fill();
        }

        ctx.restore();

        // دالة رسم الإطارات
        function drawWheel(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(car.wheelAngle);
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, car.wheelRadius, 0, Math.PI*2); ctx.fill(); // الكاوتش
            ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.arc(0, 0, car.wheelRadius * 0.5, 0, Math.PI*2); ctx.fill(); // الجنط
            ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; //ซี่ล้อ
            for(let i=0; i<4; i++) { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(car.wheelRadius*0.7, 0); ctx.stroke(); ctx.rotate(Math.PI/2); }
            ctx.restore();
        }

        let cos = Math.cos(car.angle), sin = Math.sin(car.angle);
        drawWheel(car.x + car.rearOffset*cos - 15*sin, car.y + car.rearOffset*sin + 15*cos);
        drawWheel(car.x + car.frontOffset*cos - 15*sin, car.y + car.frontOffset*sin + 15*cos);

        ctx.restore();
    }

    // 8. حلقة اللعبة المستمرة
    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
