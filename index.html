<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car X Street: Urban Racing Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js"></script>
</head>
<body>
    <header>
        <h1>Car X Street: Urban Racing</h1>
        <div id="speedometer">Speed: 0 km/h</div>
    </header>
    <main>
        <div class="level-select">
            <h2>Select Your Level:</h2>
            <button onclick="startRace('City Night Streets')">City Night Streets</button>
            <button onclick="startRace('Alley Races')">Alley Races</button>
            <button onclick="startRace('Highway')">Highway</button>
            <button onclick="startRace('Mountain Road')">Mountain Road</button>
            <button onclick="startRace('Royal Battle')">Royal Battle</button>
        </div>
        <div id="track"></div>
    </main>
    <footer>
        <p>Developed by Saif Mostafa</p>
    </footer>
</body>
</html>
