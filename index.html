<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة سيارات احترافية - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #1a1a2e;
            font-family: 'Changa', sans-serif;
            touch-action: none; user-select: none;
        }
        canvas { display: block; }
        
        /* واجهة المستخدم */
        #ui-container {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .score-board {
            background: linear-gradient(135deg, rgba(0,0,0,0.8), rgba(20,20,40,0.8));
            padding: 15px 30px; border-radius: 15px; border: 2px solid #e94560;
            color: white; font-size: 24px; font-weight: bold;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
            backdrop-filter: blur(10px);
        }
        .score-board span { color: #e94560; }

        /* أزرار التحكم (دواسات) */
        #controls {
            position: absolute; bottom: 40px; left: 40px; right: 40px;
            display: flex; justify-content: space-between; z-index: 10;
        }
        .pedal {
            width: 90px; height: 130px; border-radius: 15px;
            background: linear-gradient(to bottom, #333, #111);
            border: 4px solid #555; box-shadow: 0 10px 0 #000, 0 15px 20px rgba(0,0,0,0.5);
            color: white; font-size: 22px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.1s;
        }
        .pedal:active, .pedal.active {
            transform: translateY(10px); box-shadow: 0 0 0 #000, 0 5px 10px rgba(0,0,0,0.5);
        }
        #pedal-gas { border-color: #4CAF50; }
        #pedal-gas:active, #pedal-gas.active { border-color: #00ff00; box-shadow: 0 0 30px rgba(0,255,0,0.5); }
        #pedal-brake { border-color: #e94560; }
        #pedal-brake:active, #pedal-brake.active { border-color: #ff0000; box-shadow: 0 0 30px rgba(255,0,0,0.5); }

        @media (min-width: 800px) { #controls { display: none; } }
    </style>
</head>
<body>

<div id="ui-container">
    <div class="score-board">المسافة: <span id="distanceValue">0</span> متر</div>
</div>

<canvas id="gameCanvas"></canvas>

<!-- دواسات البنزين والفرامل للهواتف -->
<div id="controls">
    <div class="pedal" id="pedal-brake">فرامل</div>
    <div class="pedal" id="pedal-gas">بنزين</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    // 1. إعدادات السيارة والفيزياء (مضبوطة بدقة)
    let car = {
        x: 300, y: 0, width: 120, height: 35, wheelRadius: 20,
        speed: 0, maxSpeed: 25, acceleration: 0.3, braking: 0.6,
        angle: 0, wheelAngle: 0,
        vy: 0, gravity: 0.6,
        onGround: false
    };

    let cameraX = 0;
    const keys = { gas: false, brake: false };

    // 2. التحكم (لوحة المفاتيح واللمس)
    window.addEventListener('keydown', (e) => { 
        if(e.code === 'ArrowRight' || e.code === 'ArrowUp') { keys.gas = true; document.getElementById('pedal-gas').classList.add('active'); }
        if(e.code === 'ArrowLeft' || e.code === 'ArrowDown') { keys.brake = true; document.getElementById('pedal-brake').classList.add('active'); }
    });
    window.addEventListener('keyup', (e) => { 
        if(e.code === 'ArrowRight' || e.code === 'ArrowUp') { keys.gas = false; document.getElementById('pedal-gas').classList.remove('active'); }
        if(e.code === 'ArrowLeft' || e.code === 'ArrowDown') { keys.brake = false; document.getElementById('pedal-brake').classList.remove('active'); }
    });

    const setupPedal = (id, key) => {
        const btn = document.getElementById(id);
        const press = (e) => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); };
        const release = (e) => { e.preventDefault(); keys[key] = false; btn.classList.remove('active'); };
        btn.addEventListener('touchstart', press); btn.addEventListener('mousedown', press);
        btn.addEventListener('touchend', release); btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    };
    setupPedal('pedal-gas', 'gas'); setupPedal('pedal-brake', 'brake');

    // 3. تصميم الطريق (سلس وغير عشوائي)
    function getTrackData(x) {
        // أول 1500 بيكسل مستوية تماماً (لمنع تحرك السيارة لوحدها في البداية)
        if (x < 1500) return { y: canvas.height * 0.7, angle: 0 };
        
        let adjustedX = x - 1500;
        // دمج منحنيات جيبية لإنشاء تلال ناعمة جداً
        let y = canvas.height * 0.7 
              - Math.sin(adjustedX * 0.001) * 200 
              - Math.sin(adjustedX * 0.003) * 50;
        
        // حساب زاوية الميل (المشتقة)
        let slope = -Math.cos(adjustedX * 0.001) * 200 * 0.001 
                    - Math.cos(adjustedX * 0.003) * 50 * 0.003;
        
        return { y: y, angle: Math.atan(slope) };
    }

    // 4. المنطق والفيزياء (تحديث كل إطار)
    function update() {
        let track = getTrackData(car.x);

        // الجاذبية والقفز
        car.vy += car.gravity;
        car.y += car.vy;

        // التحقق من ملامسة الأرض
        if (car.y >= track.y - car.wheelRadius) {
            car.y = track.y - car.wheelRadius;
            car.vy = 0;
            car.onGround = true;
            
            // تدوير السيارة لتناسب ميل الطريق بنعومة
            car.angle += (track.angle - car.angle) * 0.2;

            // التسارع والفرامل (تعمل فقط إذا كانت السيارة على الأرض)
            if (keys.gas) {
                car.speed += car.acceleration;
            } else if (keys.brake) {
                car.speed -= car.braking;
            } else {
                // محاكاة احتكاك المحرك (تتوقف السيارة تلقائياً إذا تركت الأزرار)
                car.speed *= 0.95; 
                if (Math.abs(car.speed) < 0.1) car.speed = 0; // إيقاف تام
            }
        } else {
            car.onGround = false;
            // إمالة السيارة ببطء أثناء الطيران بناءً على الأزرار
            if (keys.brake) car.angle -= 0.03;
            if (keys.gas) car.angle += 0.03;
        }

        // تحديد السرعة القصوى
        if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
        if (car.speed < -car.maxSpeed/2) car.speed = -car.maxSpeed/2; // الرجوع للخلف أبطأ

        // تحريك السيارة للأمام بناءً على السرعة
        car.x += car.speed * Math.cos(car.angle);
        if (car.onGround) {
            car.y += car.speed * Math.sin(car.angle);
        }

        // دوران العجلات يعتمد على السرعة
        car.wheelAngle += car.speed / car.wheelRadius;

        // تحريك الكاميرا بسلاسة تامة لتتبع السيارة في محور X فقط
        cameraX += (car.x - canvas.width * 0.3 - cameraX) * 0.1;

        // تحديث واجهة المسافة
        document.getElementById('distanceValue').innerText = Math.max(0, Math.floor(car.x / 50));
    }

    // 5. رسم السيارة الاحترافية
    function drawCar(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // ظل السيارة
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(0, 20, 70, 10, 0, 0, Math.PI*2); ctx.fill();

        // عادم السيارة (نار خفيفة عند البنزين)
        if (keys.gas && car.onGround && car.speed > 5) {
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.moveTo(-60, 10); ctx.lineTo(-80 - Math.random()*20, 5); ctx.lineTo(-60, 0); ctx.fill();
        }

        // رسم جسم السيارة (Sports Car Silhouette)
        let bodyGradient = ctx.createLinearGradient(-60, -30, 60, 10);
        bodyGradient.addColorStop(0, '#e94560'); // أحمر نيون
        bodyGradient.addColorStop(1, '#8a0021');

        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.moveTo(-60, 10); // الصدام الخلفي
        ctx.lineTo(-60, -10); // الشنطة
        ctx.quadraticCurveTo(-40, -15, -20, -30); // الزجاج الخلفي
        ctx.lineTo(10, -30); // السقف
        ctx.quadraticCurveTo(30, -15, 50, -5); // الزجاج الأمامي
        ctx.lineTo(65, 0); // الكبوت
        ctx.quadraticCurveTo(70, 10, 65, 15); // الصدام الأمامي
        ctx.lineTo(-55, 15); // أسفل السيارة
        ctx.closePath();
        ctx.fill();

        // نوافذ السيارة
        ctx.fillStyle = '#0f3460';
        ctx.beginPath();
        ctx.moveTo(-15, -25); ctx.lineTo(10, -25); ctx.lineTo(25, -5); ctx.lineTo(-30, -5); ctx.closePath(); ctx.fill();

        // ضوء أمامي (كشاف)
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(60, 5, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.beginPath(); ctx.moveTo(62, 5); ctx.lineTo(300, -50); ctx.lineTo(300, 100); ctx.closePath(); ctx.fill();

        // ضوء خلفي (يضيء عند الفرامل)
        ctx.fillStyle = keys.brake ? '#ff0000' : '#550000';
        ctx.beginPath(); ctx.arc(-60, 0, 4, 0, Math.PI*2); ctx.fill();
        if (keys.brake) {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
            ctx.beginPath(); ctx.arc(-60, 0, 15, 0, Math.PI*2); ctx.fill();
        }

        // رسم العجلات
        drawWheel(-35, 15, car.wheelAngle);
        drawWheel(40, 15, car.wheelAngle);

        ctx.restore();
    }

    // رسم العجلة (جنط رياضي)
    function drawWheel(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        // الكاوتش
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(0, 0, car.wheelRadius, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 4; ctx.strokeStyle = '#222'; ctx.stroke();
        
        // الجنط الداخلي
        ctx.fillStyle = '#888';
        ctx.beginPath(); ctx.arc(0, 0, car.wheelRadius * 0.6, 0, Math.PI*2); ctx.fill();
        
        // أذرع الجنط
        ctx.lineWidth = 3; ctx.strokeStyle = '#eee';
        for(let i=0; i<5; i++) {
            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(car.wheelRadius*0.6, 0); ctx.stroke();
            ctx.rotate((Math.PI * 2) / 5);
        }
        ctx.restore();
    }

    // 6. رسم البيئة المحيطة (الريندر)
    function draw() {
        // سماء ليلية متدرجة
        let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#0f3460'); sky.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // قمر في الخلفية
        ctx.fillStyle = '#f9f6f0';
        ctx.beginPath(); ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 50, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; // إعادة ضبط الظل

        ctx.save();
        ctx.translate(-cameraX, 0); // الكاميرا تتحرك أفقياً فقط

        // رسم الطريق
        ctx.lineWidth = 20;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // بداية رسم الطريق من الكاميرا وحتى نهاية الشاشة
        let startX = Math.max(0, cameraX - 100);
        let endX = cameraX + canvas.width + 200;

        // 1. رسم التراب تحت الطريق
        ctx.beginPath();
        ctx.moveTo(startX, canvas.height);
        for (let x = startX; x <= endX; x += 50) {
            ctx.lineTo(x, getTrackData(x).y);
        }
        ctx.lineTo(endX, canvas.height);
        ctx.fillStyle = '#16213e'; // لون التراب الليلي
        ctx.fill();

        // 2. رسم خط الأسفلت (الطريق)
        ctx.beginPath();
        for (let x = startX; x <= endX; x += 20) {
            let t = getTrackData(x);
            if (x === startX) ctx.moveTo(x, t.y);
            else ctx.lineTo(x, t.y);
        }
        ctx.strokeStyle = '#e94560'; // طريق بلون نيون
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // رسم السيارة
        drawCar(car.x, car.y - car.wheelRadius - 15, car.angle);

        ctx.restore();

        // 7. رسم عداد السرعة (Dashboard)
        drawSpeedometer();
    }

    // رسم عداد السرعة على الشاشة
    function drawSpeedometer() {
        let speedPercent = Math.abs(car.speed) / car.maxSpeed;
        let centerX = canvas.width - 100;
        let centerY = 100;
        let radius = 60;

        // خلفية العداد
        ctx.beginPath(); ctx.arc(centerX, centerY, radius, Math.PI*0.75, Math.PI*2.25);
        ctx.lineWidth = 15; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();

        // مؤشر العداد المضيء
        ctx.beginPath(); ctx.arc(centerX, centerY, radius, Math.PI*0.75, Math.PI*0.75 + (speedPercent * Math.PI*1.5));
        ctx.strokeStyle = speedPercent > 0.8 ? '#ff0000' : '#00ffcc';
        ctx.stroke();

        // النص داخل العداد
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Changa'; ctx.textAlign = 'center';
        ctx.fillText(Math.floor(Math.abs(car.speed) * 5) + ' KM', centerX, centerY + 10);
        ctx.textAlign = 'start';
    }

    // 8. تشغيل اللعبة
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }
    
    // الانتظار حتى تحميل الخطوط ثم بدء اللعبة
    document.fonts.ready.then(() => { loop(); });

</script>
</body>
</html>
