<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة سباق العوالم - الإصدار الذهبي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0f172a;
            font-family: 'Changa', sans-serif; touch-action: none; user-select: none;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* نظام الشاشات */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b); z-index: 50; color: white;
        }
        .hidden { display: none !important; }
        
        /* العناوين والأزرار */
        h1 { font-size: 45px; color: #facc15; text-shadow: 0 0 20px #facc15; margin-bottom: 30px; text-align: center; line-height: 1.2;}
        h2 { color: #38bdf8; margin-bottom: 15px; font-size: 22px; }
        .btn-menu {
            width: 280px; padding: 15px; margin: 10px; font-size: 22px; font-family: 'Changa';
            background: #e11d48; color: white; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 6px 0 #9f1239; transition: 0.1s; font-weight: bold;
        }
        .btn-menu:active { transform: translateY(6px); box-shadow: 0 0 0 #9f1239; }
        .btn-secondary { background: #3b82f6; box-shadow: 0 6px 0 #1d4ed8; }
        .btn-secondary:active { box-shadow: 0 0 0 #1d4ed8; }
        
        /* الجراج (اختيار السيارة واللون) */
        .options-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .car-type-btn {
            background: #334155; border: 3px solid transparent; padding: 10px 20px;
            border-radius: 10px; color: white; cursor: pointer; font-family: 'Changa'; font-size: 18px;
        }
        .car-type-btn.selected { border-color: #facc15; background: #475569; }
        
        .color-swatch {
            width: 45px; height: 45px; border-radius: 50%; border: 3px solid transparent;
            cursor: pointer; transition: transform 0.2s;
        }
        .color-swatch.selected { border-color: white; transform: scale(1.2); box-shadow: 0 0 15px white; }
        
        #preview-canvas { background: rgba(0,0,0,0.3); border-radius: 15px; margin-bottom: 20px; border: 2px solid #38bdf8; z-index: 55;}
        
        /* منصة التتويج */
        #podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-top: 20px; height: 250px; width: 100%; overflow: hidden; }
        .podium-step {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 80px; border-radius: 10px 10px 0 0; color: #000; font-weight: bold; font-size: 35px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3); position: relative; padding-top: 10px;
        }
        .podium-car-canvas { margin-top: -50px; margin-bottom: 5px; width: 100px; } 
        
        #step1 { height: 180px; background: linear-gradient(#fde047, #b45309); z-index: 3; }
        #step2 { height: 120px; background: linear-gradient(#cbd5e1, #475569); z-index: 2; }
        #step3 { height: 80px; background: linear-gradient(#fdba74, #78350f); z-index: 1; }
        #step4 { height: 50px; background: #1e293b; color: white; }
        
        /* واجهة اللعب */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: none; }
        .hud-top { display: flex; justify-content: space-between; padding: 15px; }
        .hud-box {
            background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 12px;
            color: white; font-size: 20px; font-weight: bold; border: 2px solid #3b82f6; backdrop-filter: blur(5px);
        }
        
        /* الدواسات للهاتف */
        #controls { position: absolute; bottom: 30px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: auto; }
        .pedal { width: 85px; height: 115px; border-radius: 15px; background: linear-gradient(to bottom, #444, #222); border: 3px solid #666; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; box-shadow: 0 8px 0 #111; cursor: pointer; user-select: none; }
        .pedal.active { transform: translateY(8px); box-shadow: 0 0 0 #111; }
        #pedal-gas.active { border-color: #22c55e; }
        #pedal-brake.active { border-color: #ef4444; }
        @media (min-width: 800px) { #controls { display: none; } }
    </style>
</head>
<body>

<!-- 1. شاشة القائمة الرئيسية -->
<div id="main-menu" class="screen">
    <h1>سباق العوالم<br>🚗 World Racing 🌍</h1>
    <button class="btn-menu" onclick="startGame()">🏁 بدء السباق</button>
    <button class="btn-menu btn-secondary" onclick="showScreen('garage')">🔧 اختيار وتعديل السيارة</button>
    <button class="btn-menu btn-secondary" onclick="showScreen('settings')">⚙️ الإعدادات</button>
</div>

<!-- 2. شاشة الجراج -->
<div id="garage" class="screen hidden">
    <h2>تجهيز السيارة</h2>
    <canvas id="preview-canvas" width="200" height="100"></canvas>
    
    <h2>شكل السيارة:</h2>
    <div class="options-container">
        <button class="car-type-btn selected" onclick="selectType(this, 'sports')">رياضية</button>
        <button class="car-type-btn" onclick="selectType(this, 'truck')">شاحنة</button>
        <button class="car-type-btn" onclick="selectType(this, 'f1')">فورمولا</button>
    </div>
    <h2>لون السيارة:</h2>
    <div class="options-container">
        <div class="color-swatch selected" style="background: #e11d48;" onclick="selectColor(this, '#e11d48')"></div>
        <div class="color-swatch" style="background: #3b82f6;" onclick="selectColor(this, '#3b82f6')"></div>
        <div class="color-swatch" style="background: #22c55e;" onclick="selectColor(this, '#22c55e')"></div>
        <div class="color-swatch" style="background: #facc15;" onclick="selectColor(this, '#facc15')"></div>
        <div class="color-swatch" style="background: #a855f7;" onclick="selectColor(this, '#a855f7')"></div>
        <div class="color-swatch" style="background: #ffffff;" onclick="selectColor(this, '#ffffff')"></div>
    </div>
    <button class="btn-menu" style="margin-top: 10px;" onclick="showScreen('main-menu')">حفظ ورجوع</button>
</div>

<!-- 3. شاشة الإعدادات -->
<div id="settings" class="screen hidden">
    <h1>الإعدادات</h1>
    <button class="btn-menu" id="btn-sound" onclick="toggleSound()">🔊 الصوت: مفعل</button>
    <button class="btn-menu btn-secondary" style="margin-top: 30px;" onclick="showScreen('main-menu')">رجوع للقائمة</button>
</div>

<!-- 4. منصة التتويج (النهاية) -->
<div id="victory-screen" class="screen hidden">
    <h1 id="victory-title">تهانينا! 🎉</h1>
    
    <div id="podium-container">
        <!-- يتم رسم المنصة هنا برمجياً -->
    </div>
    <button class="btn-menu" id="next-level-btn" style="margin-top: 30px;" onclick="nextLevelAction()">المرحلة التالية ✈️</button>
    <button class="btn-menu btn-secondary" onclick="showScreen('main-menu')">القائمة الرئيسية</button>
</div>

<!-- 5. واجهة اللعب -->
<div id="game-ui">
    <div class="hud-top">
        <div class="hud-box" id="hud-rank">المركز: 1 / 4</div>
        <div class="hud-box" id="hud-world">🇪🇬 مصر</div>
    </div>
    <div id="controls">
        <div class="pedal" id="pedal-brake">فرامل</div>
        <div class="pedal" id="pedal-gas">بنزين</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    // === إعدادات اللاعب والتطبيق ===
    let playerConfig = { type: 'sports', color: '#e11d48', sound: true };
    let gameState = 'menu';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    // === إعدادات الصوت ===
    const GameAudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() {
        try {
            if (!audioCtx && GameAudioContext) audioCtx = new GameAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) { console.log("Audio not supported"); }
    }
    function playTone(freq, type, duration) {
        if (!playerConfig.sound || !audioCtx) return;
        try {
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // === دوال رسم السيارات المركزية ===
    function drawCarShape(ctx, type, color, x, y, angle, wheelAngle, wheelRadius) {
        ctx.save(); ctx.translate(x, y - wheelRadius - 5); ctx.rotate(angle);
        ctx.fillStyle = color;
        if (type === 'sports') {
            ctx.beginPath(); ctx.moveTo(-45, 5); ctx.lineTo(-45, -10); ctx.lineTo(10, -20);
            ctx.lineTo(35, -5); ctx.lineTo(50, 0); ctx.lineTo(-40, 10); ctx.fill();
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.moveTo(-10, -15); ctx.lineTo(10, -15); ctx.lineTo(20, -5); ctx.lineTo(-20, -5); ctx.fill();
        } 
        else if (type === 'truck') {
            ctx.fillRect(-45, -20, 90, 30); // الصندوق
            ctx.fillRect(15, -35, 25, 20); // الكابينة
            ctx.fillStyle = '#888'; ctx.fillRect(-45, 0, 100, 10); // الصدام
            ctx.fillStyle = '#aaddff'; ctx.fillRect(25, -30, 10, 10); // الشباك
        } 
        else if (type === 'f1') {
            ctx.fillRect(-45, -5, 100, 8); // الجسم الأساسي
            ctx.fillRect(-40, -15, 8, 10); ctx.fillRect(-45, -20, 15, 5); // الجناح الخلفي
            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(15, -15); ctx.lineTo(25, -5); ctx.fill(); // الكابينة
        }
        let wOffset = type==='truck' ? 22 : 15;
        drawWheel(ctx, -25, 10, wheelRadius, wheelAngle, wOffset);
        drawWheel(ctx, 30, 10, wheelRadius, wheelAngle, wOffset);
        ctx.restore();
    }
    
    function drawWheel(ctx, x, y, radius, angle, actualRadius) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, actualRadius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        for(let i=0; i<4; i++) { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(actualRadius*0.6, 0); ctx.stroke(); ctx.rotate(Math.PI/2); }
        ctx.restore();
    }

    // === إدارة الجراج والقوائم (تم إصلاح خطأ الشاشات هنا) ===
    window.showScreen = function(id) {
        // إخفاء جميع الشاشات أولاً
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        
        // التحقق من وجود العنصر قبل محاولة إظهاره لتجنب توقف الكود
        let targetScreen = document.getElementById(id);
        if(targetScreen) {
            targetScreen.classList.remove('hidden');
        }
        
        // إظهار وإخفاء واجهة التحكم الخاصة باللعب (التي لا تعتبر شاشة مستقلة)
        document.getElementById('game-ui').style.display = (id === 'playing') ? 'block' : 'none';
        
        gameState = id;
        if(id === 'garage') updatePreview();
    };

    window.selectType = function(btn, type) {
        document.querySelectorAll('.car-type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected'); playerConfig.type = type; updatePreview();
    };

    window.selectColor = function(el, color) {
        document.querySelectorAll('.color-swatch').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected'); playerConfig.color = color; updatePreview();
    };

    function updatePreview() {
        const pCtx = document.getElementById('preview-canvas').getContext('2d');
        pCtx.clearRect(0, 0, 200, 100);
        drawCarShape(pCtx, playerConfig.type, playerConfig.color, 100, 70, 0, 0, 15);
    }

    window.toggleSound = function() {
        playerConfig.sound = !playerConfig.sound;
        document.getElementById('btn-sound').innerText = playerConfig.sound ? '🔊 الصوت: مفعل' : '🔇 الصوت: معطل';
        initAudio();
    };

    // === العوالم ومحرك اللعبة ===
    const WORLDS = [
        { name: '🇪🇬 مصر - الصحراء', bg1: '#ff9a44', bg2: '#fc6076', fill: '#d4a373', line: '#faedcb', length: 12000, diff: 1 },
        { name: '🇯🇵 اليابان - نيون', bg1: '#0f3460', bg2: '#1a1a2e', fill: '#16213e', line: '#e94560', length: 15000, diff: 1.5 },
        { name: '🇮🇸 آيسلندا - ثلوج', bg1: '#83a4d4', bg2: '#b6fbff', fill: '#ffffff', line: '#a1c4fd', length: 18000, diff: 2 }
    ];
    let currentWorldIdx = 0, world, cars = [], cameraX = 0;
    const keys = { gas: false, brake: false };

    class Car {
        constructor(name, type, color, startX, speedConfig, isPlayer=false) {
            this.name = name; this.type = type; this.color = color;
            this.x = startX; this.y = 0; this.wheelRadius = type==='truck'? 20 : 15;
            this.speed = 0; this.maxSpeed = speedConfig.max; this.acc = speedConfig.acc;
            this.angle = 0; this.wheelAngle = 0; this.vy = 0;
            this.isPlayer = isPlayer; this.onGround = false; this.finished = false;
            this.aiGas = true; this.aiBrake = false;
        }
        update(track) {
            this.vy += 0.6; this.y += this.vy;
            let gas = this.isPlayer ? keys.gas : this.aiGas;
            let brake = this.isPlayer ? keys.brake : this.aiBrake;
            
            if (this.y >= track.y - this.wheelRadius) {
                if(!this.onGround && this.isPlayer) playTone(120, 'square', 0.1);
                this.y = track.y - this.wheelRadius; this.vy = 0; this.onGround = true;
                this.angle += (track.angle - this.angle) * 0.2;
                if (gas) this.speed += this.acc;
                else if (brake) this.speed -= 0.6;
                else this.speed *= 0.95;
            } else {
                this.onGround = false;
                if (brake) this.angle -= 0.02; if (gas) this.angle += 0.02;
            }
            if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
            if (this.speed < -10) this.speed = -10;
            this.x += this.speed * Math.cos(this.angle);
            if(this.onGround) this.y += this.speed * Math.sin(this.angle);
            this.wheelAngle += this.speed / this.wheelRadius;
            
            if(!this.isPlayer) {
                this.aiGas = this.speed < this.maxSpeed * 0.9 && track.angle < 0.3;
                this.aiBrake = track.angle < -0.4 && this.speed > this.maxSpeed * 0.8;
            }
        }
        draw(ctx) {
            drawCarShape(ctx, this.type, this.color, this.x, this.y, this.angle, this.wheelAngle, this.wheelRadius);
            ctx.save(); ctx.translate(this.x, this.y - 60);
            ctx.fillStyle = this.isPlayer ? '#facc15' : 'white'; ctx.font = 'bold 16px Changa'; ctx.textAlign = 'center';
            ctx.fillText(this.name, 0, 0); ctx.restore();
        }
    }

    // === التحكم ===
    window.addEventListener('keydown', e => { if(e.code === 'ArrowRight') keys.gas = true; if(e.code === 'ArrowLeft') keys.brake = true; });
    window.addEventListener('keyup', e => { if(e.code === 'ArrowRight') keys.gas = false; if(e.code === 'ArrowLeft') keys.brake = false; });
    
    const setBtn = (id, k) => {
        let b = document.getElementById(id);
        const press = e => { e.preventDefault(); keys[k] = true; b.classList.add('active'); };
        const release = e => { e.preventDefault(); keys[k] = false; b.classList.remove('active'); };
        b.addEventListener('touchstart', press, {passive: false}); b.addEventListener('touchend', release, {passive: false});
        b.addEventListener('mousedown', press); b.addEventListener('mouseup', release);
    };
    setBtn('pedal-gas', 'gas'); setBtn('pedal-brake', 'brake');

    // === اللعب وبناء المسار ===
    window.startGame = function() {
        initAudio(); 
        showScreen('playing'); 
        world = WORLDS[currentWorldIdx];
        document.getElementById('hud-world').innerText = world.name;
        
        let aiTypes = ['sports', 'truck', 'f1'];
        cars = [
            new Car('أنت', playerConfig.type, playerConfig.color, 400, {max: 26, acc: 0.35}, true),
            new Car('AI-1', aiTypes[Math.floor(Math.random()*3)], '#fbbf24', 300, {max: 24+world.diff, acc: 0.3}),
            new Car('AI-2', aiTypes[Math.floor(Math.random()*3)], '#94a3b8', 200, {max: 25+world.diff, acc: 0.28}),
            new Car('AI-3', aiTypes[Math.floor(Math.random()*3)], '#10b981', 100, {max: 23+world.diff, acc: 0.32})
        ];
        cameraX = 0; keys.gas = false; keys.brake = false;
        
        if(!window.isLooping) { 
            window.isLooping = true; 
            requestAnimationFrame(loop); 
        }
    };

    function getTrackY(x) {
        if(x < 1000) return { y: canvas.height * 0.7, angle: 0 };
        let dx = x - 1000; let f1 = 0.001 * world.diff, f2 = 0.003 * world.diff;
        let y = canvas.height * 0.7 - Math.sin(dx * f1) * 200 - Math.sin(dx * f2) * 80;
        let slope = -Math.cos(dx * f1) * 200 * f1 - Math.cos(dx * f2) * 80 * f2;
        return { y: y, angle: Math.atan(slope) };
    }

    // === شاشة التتويج ===
    window.nextLevelAction = function() {
        if(currentWorldIdx < WORLDS.length - 1) { currentWorldIdx++; startGame(); }
        else { currentWorldIdx = 0; showScreen('main-menu'); }
    };

    function showVictory() {
        showScreen('victory-screen');
        let sorted = [...cars].sort((a,b) => b.x - a.x);
        let playerRank = sorted.findIndex(c => c.isPlayer) + 1;
        let title = document.getElementById('victory-title');
        let btn = document.getElementById('next-level-btn');
        
        if(playerRank === 1) {
            title.innerHTML = '🎉 تهانينا! لقد فزت 🎉'; title.style.color = '#facc15';
            playTone(400, 'sine', 0.2); setTimeout(()=> playTone(600, 'sine', 0.5), 200);
            if(currentWorldIdx < WORLDS.length-1) { btn.innerText = 'السفر للدولة التالية ✈️'; btn.onclick = nextLevelAction; }
            else { btn.innerText = 'لقد ختمت اللعبة بالكامل! 🏆'; btn.onclick = nextLevelAction; }
        } else {
            title.innerHTML = `حظ أوفر.. المركز ${playerRank} 💔`; title.style.color = '#ef4444';
            playTone(200, 'sawtooth', 0.5);
            btn.innerText = 'إعادة المحاولة 🔄'; btn.onclick = startGame;
        }

        let podium = document.getElementById('podium-container'); podium.innerHTML = '';
        const order = [2, 1, 3, 4];
        order.forEach(rank => {
            if(rank > sorted.length) return;
            let car = sorted[rank-1];
            
            let stepDiv = document.createElement('div');
            stepDiv.className = 'podium-step'; stepDiv.id = 'step' + rank;
            
            let carCanvas = document.createElement('canvas');
            carCanvas.width = 100; carCanvas.height = 60;
            carCanvas.className = 'podium-car-canvas';
            drawCarShape(carCanvas.getContext('2d'), car.type, car.color, 50, 45, 0, 0, car.wheelRadius*0.7);
            
            stepDiv.appendChild(carCanvas);
            stepDiv.appendChild(document.createTextNode(rank));
            podium.appendChild(stepDiv);
        });
    }

    // === حلقة التحديث المستمرة (تم إصلاح نظام الكاميرا بالكامل) ===
    function loop() {
        if(gameState === 'playing') {
            let player = cars.find(c => c.isPlayer);
            
            // 1. تحديث موقع السيارات والفيزياء
            cars.forEach(c => c.update(getTrackY(c.x)));
            
            // 2. تحديث الكاميرا لتتبع اللاعب بشكل ناعم
            cameraX += (player.x - canvas.width * 0.3 - cameraX) * 0.1;
            
            // 3. تحديث واجهة المستخدم (المركز)
            let sorted = [...cars].sort((a,b) => b.x - a.x);
            let playerRank = sorted.findIndex(c => c.isPlayer) + 1;
            document.getElementById('hud-rank').innerText = `المركز: ${playerRank} / ${cars.length}`;

            // --- 4. رسم البيئة والمشهد ---
            // رسم لون السماء كخلفية ثابتة
            ctx.fillStyle = world.bg1; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // حفظ حالة الشاشة وتحريك الكاميرا (النظام الصحيح للرسم)
            ctx.save();
            ctx.translate(-cameraX, 0); 

            // رسم مسار الأرض مع التعرجات
            ctx.beginPath();
            ctx.moveTo(cameraX, canvas.height); 
            ctx.lineTo(cameraX, getTrackY(cameraX).y);
            
            for(let i = 0; i <= canvas.width + 50; i += 50) {
                let realX = cameraX + i;
                let trackPoint = getTrackY(realX);
                ctx.lineTo(realX, trackPoint.y);
            }
            ctx.lineTo(cameraX + canvas.width + 50, canvas.height);
            ctx.fillStyle = world.fill;
            ctx.fill();

            // رسم خط النهاية
            let finishLineX = world.length;
            if(finishLineX > cameraX && finishLineX < cameraX + canvas.width) {
                ctx.fillStyle = "white";
                ctx.fillRect(finishLineX, getTrackY(finishLineX).y - 100, 20, 100);
            }

            // رسم السيارات
            cars.forEach(c => {
                c.draw(ctx); 
            });

            ctx.restore(); // إرجاع الشاشة لوضعها الطبيعي لإلغاء تأثير الكاميرا للفة القادمة

            // 5. التحقق من الوصول لخط النهاية
            if (player.x >= world.length) {
                gameState = 'victory';
                showVictory();
            } else {
                requestAnimationFrame(loop);
            }
        } else {
            // إذا كانت اللعبة متوقفة (في القوائم)، استمر في الاستعداد
            requestAnimationFrame(loop);
        }
    }
</script>
